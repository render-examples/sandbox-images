name: Publish an image candidate
run-name: Publish ${{ inputs.image }} from ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'render-examples/sandbox-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: sandbox-validation
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SLUG: ${{ inputs.image }}
        run: node scripts/check-publication-ci.ts
      - name: Require live validation configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          RENDER_SANDBOX_GROUP_ID: ${{ vars.RENDER_SANDBOX_GROUP_ID }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_WORKSPACE_ID"
          test -n "$RENDER_SANDBOX_GROUP_ID"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install pinned security scanners
        run: sh scripts/install-security-tools.sh "$RUNNER_TEMP/security-tools"
      - name: Scan source for secrets
        run: |
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact --config .gitleaks.toml .
          "$RUNNER_TEMP/security-tools/gitleaks" dir --redact --config .gitleaks.toml .
      - name: Resolve and validate candidate
        id: candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: |
          python3 scripts/export-catalog.py --output artifacts/catalog.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          asset = next(a for a in json.load(open('artifacts/catalog.json'))['assets'] if a['slug'] == os.environ['IMAGE_SLUG'])
          assert asset['kind'] == 'sandbox-image'
          assert asset['source']['repository'] == 'https://github.com/' + os.environ['GITHUB_REPOSITORY']
          print('remote=' + asset['image']['repository'] + ':' + asset['image']['tag'])
          PY
      - name: Reject an existing tag before building
        env:
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release-absent.py "$REMOTE_IMAGE"
      - name: Build and test exactly what will be pushed
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: python3 scripts/check-image.py "$IMAGE_SLUG"
      - name: Scan the tested image before publication
        env:
          IMAGE_SLUG: ${{ inputs.image }}
          TRIVY_BIN: ${{ runner.temp }}/security-tools/trivy
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: node tools/image-security.ts scan "$IMAGE_SLUG"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace a release tag
        env:
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release-absent.py "$REMOTE_IMAGE"
      - name: Recheck exact-commit CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SLUG: ${{ inputs.image }}
        run: node scripts/check-publication-ci.ts
      - name: Push tested candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
        run: |
          node tools/image-security.ts verify "$IMAGE_SLUG"
          IMAGE_ID=$(python3 - <<'PY'
          import json, os
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert receipt['localChecksPassed'] is True
          print(receipt['imageId'])
          PY
          )
          docker tag "$IMAGE_ID" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          docker buildx imagetools inspect "$REMOTE_IMAGE" --raw > artifacts/oci-manifest.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('artifacts/oci-manifest.json'))
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert manifest['config']['digest'] == receipt['configDigest'], 'Published image differs from tested image'
          PY
          docker buildx imagetools inspect "$REMOTE_IMAGE" --format '{{json .Manifest}}' > artifacts/oci-descriptor.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-receipt-${{ inputs.image }}
          path: artifacts/
          if-no-files-found: error

  validate:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sandbox-validation
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Download this image's publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SLUG: ${{ inputs.image }}
        run: gh run download "$GITHUB_RUN_ID" --name "publication-receipt-$IMAGE_SLUG" --dir artifacts
      - name: Validate the published image and every snapshot recipe on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          RENDER_SANDBOX_GROUP_ID: ${{ vars.RENDER_SANDBOX_GROUP_ID }}
          IMAGE_SLUG: ${{ inputs.image }}
        run: >-
          node tools/release-image.ts --image "$IMAGE_SLUG" --publication artifacts
          --workspace "$RENDER_WORKSPACE_ID" --group "$RENDER_SANDBOX_GROUP_ID"
          --output artifacts/live-release
      - name: Publish the verified registry receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(node -p 'const r=JSON.parse(require("node:fs").readFileSync("artifacts/live-release/release.json","utf8")); "image-"+r.slug+"-"+r.version')
          gh release create "$RELEASE_TAG" artifacts/live-release/release.json artifacts/security-*.json artifacts/sbom-*.cdx.json --latest=false --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes 'Published image and prepared recipes passed security, workload, Render capture/restore and cleanup checks using synthetic inputs without model API calls. release.json contains the immutable image digest and verification evidence.'
          gh release edit "$RELEASE_TAG" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-validation-${{ inputs.image }}-${{ github.run_attempt }}
          path: artifacts/live-release/
          if-no-files-found: warn
