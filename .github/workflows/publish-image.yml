name: Publish an image candidate

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image slug (the source manifest supplies its version)
        type: choice
        options: [python-analysis]
        required: true

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve and validate candidate
        id: candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: |
          python3 scripts/export-catalog.py --output artifacts/catalog.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          asset = next(a for a in json.load(open('artifacts/catalog.json'))['assets'] if a['slug'] == os.environ['IMAGE_SLUG'])
          assert asset['kind'] == 'sandbox-image'
          assert asset['source']['repository'] == 'https://github.com/' + os.environ['GITHUB_REPOSITORY']
          print('remote=' + asset['image']['repository'] + ':' + asset['image']['tag'])
          PY
      - name: Build and test exactly what will be pushed
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: python3 scripts/check-image.py "$IMAGE_SLUG"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace a release tag
        env:
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release-absent.py "$REMOTE_IMAGE"
      - name: Push tested candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
        run: |
          IMAGE_ID=$(python3 - <<'PY'
          import json, os
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert receipt['localChecksPassed'] is True
          print(receipt['imageId'])
          PY
          )
          docker tag "$IMAGE_ID" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          docker buildx imagetools inspect "$REMOTE_IMAGE" --raw > artifacts/oci-manifest.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('artifacts/oci-manifest.json'))
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert manifest['config']['digest'] == receipt['configDigest'], 'Published image differs from tested image'
          PY
          docker buildx imagetools inspect "$REMOTE_IMAGE" --format '{{json .Manifest}}' > artifacts/oci-descriptor.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-receipt-${{ inputs.image }}
          path: artifacts/
          if-no-files-found: error
