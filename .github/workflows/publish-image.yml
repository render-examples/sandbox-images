name: Publish an image candidate
run-name: Publish ${{ inputs.image }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image slug (the source manifest supplies its version)
        type: choice
        options: [browser-use, claude-code, codex, coding-workspace, cursor-cli, deepeval, devin-cli, document-extraction, dspy, geospatial, goose, inspect-ai, integration-test, langchain-agent, llamaindex, mastra-agent, media-processing, mini-swe-agent, office-artifacts, opencode, openhands-sdk, playwright, postgres-lab, promptfoo, pydantic-ai, python-analysis, python-api-postgres, python-coding, python-optimization, ragas, retrieval-local, scientific-python, smolagents, stagehand, typescript-agent-workflows, typescript-agents, typescript-ai-gateway, typescript-ai-ui, typescript-api-postgres, typescript-data, typescript-evals, typescript-image, typescript-openapi, typescript-rag, typescript-sqlite, typescript-tools]
        required: true

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publication-ci.ts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve and validate candidate
        id: candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: |
          python3 scripts/export-catalog.py --output artifacts/catalog.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          asset = next(a for a in json.load(open('artifacts/catalog.json'))['assets'] if a['slug'] == os.environ['IMAGE_SLUG'])
          assert asset['kind'] == 'sandbox-image'
          assert asset['source']['repository'] == 'https://github.com/' + os.environ['GITHUB_REPOSITORY']
          print('remote=' + asset['image']['repository'] + ':' + asset['image']['tag'])
          PY
      - name: Build and test exactly what will be pushed
        env:
          IMAGE_SLUG: ${{ inputs.image }}
        run: python3 scripts/check-image.py "$IMAGE_SLUG"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace a release tag
        env:
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release-absent.py "$REMOTE_IMAGE"
      - name: Recheck exact-commit CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publication-ci.ts
      - name: Push tested candidate
        env:
          IMAGE_SLUG: ${{ inputs.image }}
          REMOTE_IMAGE: ${{ steps.candidate.outputs.remote }}
        run: |
          IMAGE_ID=$(python3 - <<'PY'
          import json, os
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert receipt['localChecksPassed'] is True
          print(receipt['imageId'])
          PY
          )
          docker tag "$IMAGE_ID" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          docker buildx imagetools inspect "$REMOTE_IMAGE" --raw > artifacts/oci-manifest.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('artifacts/oci-manifest.json'))
          receipt = json.load(open('artifacts/checked-' + os.environ['IMAGE_SLUG'] + '.json'))
          assert manifest['config']['digest'] == receipt['configDigest'], 'Published image differs from tested image'
          PY
          docker buildx imagetools inspect "$REMOTE_IMAGE" --format '{{json .Manifest}}' > artifacts/oci-descriptor.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt-${{ inputs.image }}
          path: artifacts/
          if-no-files-found: error
