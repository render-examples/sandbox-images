name: Check images and recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifests and export technical catalog
        run: |
          python3 scripts/test-export.py
          python3 scripts/test-release.py
          python3 scripts/test-check-image.py
          python3 scripts/export-catalog.py --output artifacts/catalog.json
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          assets = json.load(open('artifacts/catalog.json'))['assets']
          print('images=' + json.dumps([a['slug'] for a in assets if a['kind'] == 'sandbox-image']))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technical-catalog
          path: artifacts/catalog.json
          if-no-files-found: error

  images:
    needs: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.manifests.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and run offline acceptance workloads
        env:
          IMAGE_SLUG: ${{ matrix.image }}
        run: python3 scripts/check-image.py "$IMAGE_SLUG"

  recipe-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npm run typecheck
        working-directory: tools
      - run: npm test
        working-directory: tools
