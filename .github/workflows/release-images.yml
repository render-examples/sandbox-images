name: Release sandbox images
on:
  workflow_dispatch:
    inputs:
      images:
        description: Comma-separated image slugs, or all unpublished candidates
        default: all
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sandbox-image-releases
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: matrix
        env:
          RELEASE_IMAGES: ${{ inputs.images }}
        run: echo "images=$(node scripts/release-matrix.ts)" >> "$GITHUB_OUTPUT"
  release:
    needs: select
    permissions:
      contents: write
      actions: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: ${{ matrix.image }}
    secrets: inherit
