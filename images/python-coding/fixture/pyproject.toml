[project]
name = "render-python-coding-fixture"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
